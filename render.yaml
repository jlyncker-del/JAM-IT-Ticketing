databases:
  - name: jam-it-helpdesk-db
    databaseName: jam_it_helpdesk
    user: jam_it_helpdesk

services:
  - type: web
    name: jam-it-helpdesk-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jam-it-helpdesk-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_PROVIDER
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: UPLOAD_STORAGE
        value: local
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: jam-it-helpdesk-uploads
      mountPath: /var/data
      sizeGB: 10

  - type: web
    name: jam-it-helpdesk
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_NAME
        value: JAM IT HelpDesk
      - key: VITE_COMPANY_NAME
        value: JAM IT Dienstleistungen
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
